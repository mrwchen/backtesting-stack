services:
  init-stock-analyser-filter-research-schema:
    image: postgres:17-alpine
    restart: "no"
    volumes:
      - ./init/schema.sql:/init.sql:ro
    environment:
      PGPASSWORD: "postgres-ts-root-pw"
      PGAPPNAME: "stock_analyser_filter_research_init"
      # true deletes all three service-owned result tables before recreating them.
      DROP_ALL_STOCK_ANALYSER_FILTER_RESEARCH_TABLES_ON_START: "${DROP_ALL_STOCK_ANALYSER_FILTER_RESEARCH_TABLES_ON_START:-false}"
    command:
      - sh
      - -c
      - >
        psql -h timescaledb -p 5432 -U postgres-ts -d postgres
        -v ON_ERROR_STOP=1
        -v drop_all_stock_analyser_filter_research_tables_on_start="$${DROP_ALL_STOCK_ANALYSER_FILTER_RESEARCH_TABLES_ON_START:-false}"
        -f /init.sql
    networks:
      - shared_net

  stock-analyser-filter-research:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m stock_analyser_filter_research
    depends_on:
      init-stock-analyser-filter-research-schema:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 6g
    environment:
      PGHOST: "timescaledb"
      PGPORT: "5432"
      PGDATABASE: "postgres"
      PGUSER: "market-data-account"
      PGPASSWORD: "market-data-account-pw"
      PGAPPNAME: "stock_analyser_filter_research"
      DB_CONNECT_TIMEOUT_SECONDS: "15"
      DB_STATEMENT_TIMEOUT_MS: "0"
      SOURCE_TABLE: "stock_analyser_trend_template_daily"
      FUNDAMENTAL_SNAPSHOT_TABLE: "stock_core_sec_fundamentals_asof_daily"
      QUARTERLY_FUNDAMENTAL_EVENT_TABLE: "stock_core_sec_quarterly_fundamental_events"
      SIGNAL_RESULT_TABLE: "stock_analyser_filter_research_signal_results"
      EARLY_CUT_RESULT_TABLE: "stock_analyser_filter_research_early_cut_results"
      RULE_RESULT_TABLE: "stock_analyser_filter_research_rule_results"
      LOG_LEVEL: "INFO"

      SIGNAL_START_DATE: "2016-01-01"
      SIGNAL_END_DATE: ""
      DISCOVERY_END_DATE: "2022-12-31"
      VALIDATION_END_DATE: "2024-12-31"
      # The first global trading session after this date is the new untouched holdout.
      HOLDOUT_CUTOFF_DATE: "2026-07-20"

      WEAK_5D_MAX_GAIN_PCT: "2.0"
      STRONG_5D_MIN_GAIN_PCT: "5.0"
      DEEP_LOSS_5D_MAX_LOSS_PCT: "-5.0"

      QUANTILE_COUNT: "10"
      MAX_CONDITIONS_PER_OBJECTIVE: "2"
      RULE_SEARCH_BEAM_WIDTH: "20"
      WALK_FORWARD_FIRST_YEAR: "2020"
      MIN_WALK_FORWARD_FOLDS: "4"
      MIN_STABLE_FOLD_FRACTION: "0.75"
      MIN_FOLD_OBJECTIVE_LIFT: "1.00"
      MIN_FOLD_SAMPLE_COUNT: "200"
      MIN_FOLD_OBJECTIVE_COUNT: "20"
      MIN_FOLD_PROTECTED_RETENTION_PCT: "0.90"
      MAX_FOLD_MATCH_PCT: "0.40"
      MIN_CANDIDATE_MATCH_PCT: "0.01"
      MAX_CANDIDATE_MATCH_PCT: "0.35"
      MIN_PROTECTED_RETENTION_PCT: "0.92"
      MIN_MATCHED_LABEL_COVERAGE_PCT: "0.90"
      MIN_OBJECTIVE_LIFT: "1.05"
      MIN_SELECTION_SCORE_IMPROVEMENT: "0.01"
      MIN_HOLDOUT_SAMPLE_COUNT: "500"

      MAX_WORKERS: "4"
      WORKER_IDENTITY_BATCH_SIZE: "16"
      DB_FETCH_BATCH_SIZE: "10000"
      DB_COPY_BATCH_SIZE: "5000"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: shared_net
