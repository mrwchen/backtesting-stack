services:
  init-minervini-schema:
    image: postgres:17-alpine
    restart: "no"
    volumes:
      - ./init/schema.sql:/init.sql:ro
    environment:
      # Root-Passwort der TimescaleDB, nur fuer die Schema-Initialisierung.
      PGPASSWORD: "postgres-ts-root-pw"
      # Anwendungsname in pg_stat_activity (Diagnose, welche Verbindung von wem kommt).
      PGAPPNAME: "backtesting_minervini_init"
      # true = ALLE backtesting_minervini_*-Tabellen droppen und neu anlegen.
      # Achtung: loescht saemtliche bisherigen Runs/Trades/Screens unwiderruflich.
      DROP_ALL_MINERVINI_TABLES_ON_START: "${DROP_ALL_MINERVINI_TABLES_ON_START:-false}"
    command:
      - sh
      - -c
      - >
        psql -h timescaledb -p 5432 -U postgres-ts -d postgres
        -v ON_ERROR_STOP=1
        -v drop_all_minervini_tables_on_start="$${DROP_ALL_MINERVINI_TABLES_ON_START:-false}"
        -f /init.sql
    networks:
      - shared_net

  minervini-backtester:
    build: .
    command: python -m src.runner
    depends_on:
      init-minervini-schema:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - ./cache:/cache
    environment:
      # -- Datenbank-Verbindung -------------------------------------------------
      # Hostname der TimescaleDB im shared_net Docker-Netzwerk.
      PGHOST: "timescaledb"
      # Port der TimescaleDB.
      PGPORT: "5432"
      # Datenbankname (die stock_core_*-Quelltabellen und die Ergebnistabellen liegen beide hier).
      PGDATABASE: "postgres"
      # DB-Benutzer mit SELECT auf stock_core_* und INSERT/UPDATE/DELETE auf backtesting_minervini_*.
      PGUSER: "market-data-account"
      # Passwort des DB-Benutzers.
      PGPASSWORD: "market-data-account-pw"

      # -- Ablaufsteuerung --------------------------------------------------------
      # Welche Pipeline-Stufe laeuft: screen (RS + Trend Template + Fundamentals),
      # setup (VCP-Erkennung), sim (Trade-Simulation), all (alle drei nacheinander)
      # oder sensitivity (eingefrorene Moderate-Marktfilter-Ablation nur 2020-2023).
      # Stufen lesen ihre Eingaben aus der DB und sind einzeln wiederholbar.
      STAGE: "sensitivity"
      # Erster Tag des Auswertungsfensters (Screens/Setups/Trades werden ab hier geschrieben).
      # Indikatoren brauchen davor ~1 Jahr Warmup; Preishistorie beginnt 2020-01-02.
      START_DATE: "2020-01-02"
      # Das Ablationsfenster endet fest vor dem bereits betrachteten OOS-Zeitraum.
      END_DATE: "2023-12-31"
      # Freitext-Label des Runs; landet in backtesting_minervini_runs.run_label
      # (z. B. zum Unterscheiden von Parameter-Experimenten in Grafana).
      RUN_LABEL: "minervini_daily_pivot_dev_market_ablation_v1"
      # Verzeichnis fuer den lokalen Parquet-Cache der DB-Abfragen (Volume ./cache).
      CACHE_DIR: "/cache"
      # true = Parquet-Cache ignorieren und alle Quelldaten frisch aus der DB laden
      # (noetig, wenn sich Quelldaten rueckwirkend geaendert haben).
      FORCE_REFRESH: "false"
      # Zusaetzliche Kalendertage Preishistorie VOR START_DATE, damit 200d-MA,
      # 52-Wochen-Fenster und RS-Lookbacks am Starttag bereits warm sind.
      WARMUP_CALENDAR_DAYS: "550"
      # Welche Zeilen in screen_daily persistiert werden:
      # passed = nur Tage/Symbole, die den kompletten Screen bestehen (kompakt);
      # universe = alle rankbaren Symbole inkl. Fail-Flags (gross, gut fuer Analyse in Grafana).
      SCREEN_PERSIST: "passed"
      # Log-Detailgrad: DEBUG, INFO, WARNING, ERROR.
      LOG_LEVEL: "INFO"
      # Simulationsmodus:
      # independent = jedes getriggerte Setup unabhaengig handeln (Research-Modus).
      # portfolio   = echte Cash-, Exposure- und Positionslimits anwenden.
      # Fuer die Signal-Ablation werden Cash- und Slot-Effekte ausgeblendet.
      # Die zwei festen Arme unterscheiden sich ausschliesslich darin, ob der
      # am Vortag bekannte QQQ/VOO-Marktstatus neue Entries blockieren darf.
      SIMULATION_MODE: "independent"

      # -- Universumsfilter (werden pro Tag, also as-of-date angewendet) ----------
      # Mindest-Schlusskurs in USD; Aktien darunter sind nicht rankbar (Penny-Stock-Filter).
      MIN_PRICE: "5.0"
      # Mindest-Dollar-Umsatz pro Tag (Ø ueber 63 Handelstage, Kurs x Volumen) in USD;
      # filtert illiquide Titel aus RS-Ranking und Screen.
      MIN_DOLLAR_VOLUME: "2000000"

      # -- Relative Strength (IBD-Naeherung, Querschnitts-Perzentil 1-99) ---------
      # Lookback-Perioden in Handelstagen fuer den RS-Rohscore
      # (63/126/189/252 = ca. 3/6/9/12 Monate).
      RS_LOOKBACKS: "63,126,189,252"
      # Gewichte der Lookbacks in gleicher Reihenfolge; 2,1,1,1 = letztes Quartal doppelt.
      RS_WEIGHTS: "2,1,1,1"
      # Mindest-RS-Rating (1-99) fuer Kriterium 8 des Trend Templates.
      # Minervini: >= 70, bevorzugt 80-90+.
      RS_MIN: "70"

      # -- Trend Template (Minervinis 8-Punkte-Filter) ----------------------------
      # Ueber wie viele Handelstage die 200d-MA gestiegen sein muss (Kriterium 3);
      # 21 Handelstage = ca. 1 Monat.
      MA200_TREND_DAYS: "21"
      # Kurs muss mindestens diesen Faktor ueber dem 52-Wochen-Tief liegen
      # (1.30 = 30 % ueber dem Tief, Kriterium 6).
      MIN_ABOVE_52W_LOW: "1.30"
      # Kurs muss mindestens diesen Faktor des 52-Wochen-Hochs erreichen
      # (0.75 = hoechstens 25 % unter dem Hoch, Kriterium 7).
      MAX_BELOW_52W_HIGH: "0.75"

      # -- IBD-inspiriertes Marktmodell -----------------------------------------
      # QQQ startet Rally Attempts und Follow-Through Days. QQQ und VOO tragen
      # Distribution Days bei. Alle Close-/Volumensignale von t gelten erst t+1.
      # true = Marktstatus begrenzt neue Entries und Portfolio-Exposure.
      # Offene Positionen laufen weiterhin in ihre regulaeren Exits.
      # true erzwingt bereits beim Laden die Vollstaendigkeitspruefung fuer QQQ
      # und VOO. Der sensitivity-Workflow setzt den Wert je Arm auf off/on.
      MARKET_FILTER_ENABLE: "true"
      MARKET_INDEX_SYMBOLS: "QQQ,VOO"
      MARKET_PRIMARY_INDEX: "QQQ"
      # Follow-Through Day ab Rally-Tag 4: mindestens +1,25 % und mehr Volumen
      # als in der vorherigen Sitzung.
      FTD_MIN_RALLY_DAY: "4"
      FTD_MIN_GAIN: "0.0125"
      # Distribution Day: mindestens -0,2 % bei hoeherem Volumen. Vier aktive
      # Tage setzen den Trend unter Druck, sechs beenden ihn. Ereignisse
      # verfallen nach 25 Handelssitzungen.
      DISTRIBUTION_MIN_LOSS: "0.002"
      DISTRIBUTION_LOOKBACK_SESSIONS: "25"
      DISTRIBUTION_PRESSURE_COUNT: "4"
      DISTRIBUTION_CORRECTION_COUNT: "6"
      # Breadth ist nur noch Exposure-Bestaetigung, nicht der primaere Schalter.
      BREADTH_ON_THRESHOLD: "0.50"
      BREADTH_OFF_THRESHOLD: "0.45"
      # Maximales Entry-Exposure je Marktstatus. In Portfolio-Mode gilt das
      # Minimum aus diesem Cap und dem gewinn-/verlustbasierten Exposure-Level.
      MARKET_CONFIRMED_MAX_EXPOSURE_PCT: "1.0"
      MARKET_CONFIRMED_WEAK_BREADTH_MAX_EXPOSURE_PCT: "0.25"
      MARKET_UNDER_PRESSURE_MAX_EXPOSURE_PCT: "0.50"
      MARKET_UNDER_PRESSURE_WEAK_BREADTH_MAX_EXPOSURE_PCT: "0.25"

      # -- Welt-Regime Entry-Gate -----------------------------------------------
      # true = neue Entries nur, wenn das zuletzt bekannte Welt-Regime zu den
      # erlaubten Labels gehoert. Der Score fuer Tag d ist wegen seines Cutoffs
      # erst ab d+1 nutzbar; Wochenend-Scores gelten fuer die naechste Session.
      REGIME_ENTRY_FILTER_ENABLE: "false"
      # Defensive-Regime wird standardmaessig blockiert.
      REGIME_ALLOWED_LABELS: "RISK-ON,CONSTRUCTIVE,NEUTRAL"

      # -- IBKR-Gruppenfuehrung (Industry -> Category -> staerkste Aktien) -------
      # true = Screen verlangt starke IBKR Industry, starke IBKR Category und
      # Fuehrung der Aktie innerhalb dieser Gruppen.
      IBKR_GROUP_FILTER_ENABLE: "true"
      # Mindest-RS-Rating der IBKR Industry-Gruppe (1-99), berechnet aus dem
      # Median-RS der rankbaren Mitglieder.
      IBKR_INDUSTRY_RS_MIN: "70"
      # Mindest-RS-Rating der IBKR Category innerhalb ihrer Industry.
      IBKR_CATEGORY_RS_MIN: "70"
      # Mindest-RS-Rating der Aktie innerhalb ihrer IBKR Industry.
      IBKR_STOCK_IN_INDUSTRY_RS_MIN: "70"
      # Mindest-RS-Rating der Aktie innerhalb ihrer IBKR Category.
      IBKR_STOCK_IN_CATEGORY_RS_MIN: "70"
      # Mindestzahl rankbarer Mitglieder, damit eine Industry/Category pro Tag
      # als vergleichbare Gruppe gewertet wird.
      IBKR_INDUSTRY_MIN_SYMBOLS: "5"
      IBKR_CATEGORY_MIN_SYMBOLS: "3"
      # Zusaetzlicher Breadth-Gate je IBKR Industry: Anteil der Aktien dieser
      # Industry ueber ihrer 200d-MA. Nur aktive Industries duerfen screenen.
      IBKR_INDUSTRY_BREADTH_FILTER_ENABLE: "true"
      # Industry-Gate schaltet AN, wenn die Breadth mindestens 55 % erreicht.
      IBKR_INDUSTRY_BREADTH_ON_THRESHOLD: "0.55"
      # Industry-Gate bleibt an bis die Breadth unter 45 % faellt.
      IBKR_INDUSTRY_BREADTH_OFF_THRESHOLD: "0.45"
      # Mindestzahl rankbarer Aktien je Industry fuer die Breadth-Berechnung.
      IBKR_INDUSTRY_BREADTH_MIN_SYMBOLS: "5"

      # -- Fundamentals (point-in-time aus SEC-Filings; diskrete Quartals-EPS
      #    mit strengem SEC-Komponenten-/Q4-Fallback) ------------------------------
      # Mindest-EPS-Wachstum Quartal vs. Vorjahresquartal (0.20 = +20 %).
      EPS_YOY_MIN: "0.20"
      # Mindest-Umsatzwachstum Quartal vs. Vorjahresquartal (0.10 = +10 %).
      REVENUE_YOY_MIN: "0.10"
      # true = Setups mit bekannt schwachem EPS- UND Umsatzwachstum werden in
      # der Simulation nicht gehandelt. Fehlende EPS-Daten bleiben erlaubt.
      BAD_FUNDAMENTALS_FILTER_ENABLE: "true"
      # Wie viele der sechs Flags (EPS, Umsatz, Margen, Beschleunigung,
      # Wachstumsserie, Jahresstabilitaet) mindestens
      # bestehen muessen, damit fundamentals_pass = true.
      FUNDAMENTALS_MIN_PASS: "4"
      MARGIN_EXPANSION_MIN: "0.0"
      ACCELERATION_MIN: "0.0"
      QUARTERLY_GROWTH_STREAK_MIN: "2"
      QUARTERLY_FUNDAMENTAL_STALE_TRADING_DAYS: "130"
      INSTITUTIONAL_SPONSORSHIP_FILTER_ENABLE: "true"
      INSTITUTIONAL_MIN_MANAGERS: "10"
      INSTITUTIONAL_NET_ACTIVITY_MIN: "0"
      INSTITUTIONAL_ACTIVITY_LOOKBACK_SESSIONS: "130"

      # -- VCP-Erkennung (Volatility Contraction Pattern) --------------------------
      # Swing-Fenster k: ein Hoch/Tief gilt als Swingpunkt, wenn es Extremum ueber
      # +-k Bars ist. Ein Swing ist erst k Bars spaeter bestaetigt (kein Look-Ahead).
      # Kleiner = mehr, feinere Swings; groesser = nur markante Swings.
      SWING_WINDOW: "3"
      # Minimale Basisdauer in Handelstagen (erstes Basishoch bis Erkennungstag).
      BASE_MIN_DAYS: "15"
      # Maximale Basisdauer in Handelstagen; aeltere Strukturen gelten nicht mehr als Basis.
      BASE_MAX_DAYS: "75"
      # Minimale Anzahl Kontraktionen (Hoch->Tief-Wellen) in der Basis.
      CONTRACTIONS_MIN: "2"
      # Maximale Anzahl Kontraktionen, die betrachtet werden.
      CONTRACTIONS_MAX: "4"
      # Maximale Tiefe der LETZTEN Kontraktion (0.10 = 10 %); die finale Welle
      # muss eng sein - Kern des VCP. Der Schlusskurs muss am Erkennungstag
      # ebenfalls hoechstens so weit unter dem Pivot liegen.
      FINAL_DEPTH_MAX: "0.10"
      # Maximale Tiefe der ERSTEN Kontraktion (0.35 = 35 %); tiefere Basen sind
      # beschaedigte Charts, keine Konsolidierung.
      BASE_DEPTH_MAX: "0.35"
      # Pivot (Hoch der letzten Kontraktion) darf hoechstens so weit unter dem
      # Basishoch liegen (0.05 = 5 %), sonst droht Overhead-Supply beim Ausbruch.
      PIVOT_BELOW_BASE_HIGH_MAX: "0.05"
      # Volumen-Dry-up: Ø-Volumen der letzten 5 Tage geteilt durch 50d-Ø-Volumen.
      # Fuer die Ablation ist das Moderate-Band 0.20-0.85 eingefroren.
      DRYUP_RATIO_MIN: "0.20"
      DRYUP_RATIO_MAX: "0.85"
      # Zielbereich fuer die Portfolio-Priorisierung bei konkurrierenden Setups.
      DRYUP_RATIO_PREFERRED: "0.65"
      # Wie viele globale Handelssessions ein erkanntes Setup fuer den Breakout
      # gueltig bleibt; Symbol-Halts pausieren die Frist nicht. Danach kann nur
      # eine neue Swing-Struktur wieder ein Setup bilden.
      SETUP_VALID_DAYS: "15"
      VCP_SCORE_MIN: "60"

      # -- Simulation --------------------------------------------------------------
      # Independent nutzt INITIAL_EQUITY ohne Cash-/Positionslimits. Portfolio
      # reserviert Cash, Gross Exposure und Slots vor der Session. In beiden Modi
      # wird die Stueckzahl am oberen Rand der Buy Zone vorab festgelegt.
      # Fixe Startbasis in USD fuer Positionsgroesse und Research-Equity-Kurve.
      INITIAL_EQUITY: "100000"
      # Risiko pro Trade als Anteil der Basis (0.01 = 1 % = 1000 USD):
      # Stueckzahl = Risiko / (oberer Buy-Zone-Fill - Stop).
      RISK_PCT: "0.01"
      # Maximaler Stop-Abstand unter dem Pivot (0.08 = 8 %); liegt das letzte
      # Kontraktionstief tiefer, wird der Stop auf diesen Abstand begrenzt.
      STOP_MAX_PCT: "0.08"
      # Obergrenze der Positionsgroesse als Anteil der Basis (0.25 = max. 25.000 USD
      # Notional); begrenzt Trades mit sehr engem Stop.
      MAX_POSITION_PCT: "0.25"
      # Slippage pro Fill als Kursanteil (0.001 = 0,1 %): Kauf teurer, Verkauf billiger.
      SLIPPAGE_PCT: "0.001"
      # Kommission pro Seite als Anteil des Handelswerts (0.0005 = 5 Basispunkte).
      COMMISSION_PCT: "0.0005"
      # Trailing-Exit: schliesst die Position (naechstes Open), wenn der Schlusskurs
      # unter die MA dieser Laenge faellt (50 = 50-Tage-Linie).
      TRAIL_MA_DAYS: "50"
      # Failed-Breakout-Exit: wenn ein Breakout nach N Handelstagen wieder unter
      # Pivot oder unter den konfigurierten R-Schwellenwert kippt, wird am
      # naechsten Open geschlossen. -0.5 R ist bewusst weniger aggressiv als v6.
      FAILED_BREAKOUT_EXIT_ENABLE: "true"
      FAILED_BREAKOUT_DAYS: "12"
      FAILED_BREAKOUT_MIN_R: "-0.5"
      # Stop-Buy wird vor der Session aus dem am Vortag bekannten Setup gebaut.
      # Beruehrt das Tageshoch den Trigger, erfolgt der Fill am selben Tag.
      # Tages-Close und Tages-Volumen beeinflussen diesen Entry nicht.
      PIVOT_BUFFER_PCT: "0.001"
      MAX_BUY_ZONE_PCT: "0.02"
      TIME_STOP_SESSIONS: "10"
      TIME_STOP_MIN_R: "1.0"
      PROFIT_PROTECTION_TRIGGER_R: "2.0"
      PROFIT_PROTECTION_LOCK_R: "0.5"

      # -- Portfolio-Constraints (nur SIMULATION_MODE=portfolio) -----------------
      # Maximal gleichzeitig offene Positionen. 8 ist bewusst konservativ, damit
      # Signalhaufen nicht automatisch zu unrealistischer Ueberdiversifikation werden.
      PORTFOLIO_MAX_OPEN_POSITIONS: "8"
      # Maximaler Brutto-Exposure-Anteil am mark-to-market Portfolio-Equity.
      # 1.0 = kein Hebel; Cash darf nicht negativ werden.
      PORTFOLIO_MAX_GROSS_EXPOSURE_PCT: "1.0"
      EXPOSURE_LEVELS: "0.25,0.50,0.75,1.00"
      EXPOSURE_WINNERS_TO_STEP_UP: "2"
      EXPOSURE_LOSSES_TO_RESET: "2"
      EXPOSURE_DRAWDOWN_RESET_PCT: "0.04"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: shared_net
