services:
  init-wei-schema:
    image: postgres:17-alpine
    restart: "no"
    volumes:
      - ./init/schema.sql:/init.sql:ro
    environment:
      # Root-Passwort der TimescaleDB, nur fuer die Schema-Initialisierung.
      PGPASSWORD: "postgres-ts-root-pw"
      # Anwendungsname in pg_stat_activity (Diagnose, welche Verbindung von wem kommt).
      PGAPPNAME: "backtest_wei_init"
      # true = ALLE backtest_wei_*-Tabellen droppen und neu anlegen.
      # Achtung: loescht saemtliche bisherigen Runs/Trades/Equity-Kurven unwiderruflich.
      DROP_ALL_WEI_TABLES_ON_START: "false"
    command:
      - sh
      - -c
      - >
        psql -h timescaledb -p 5432 -U postgres-ts -d postgres
        -v ON_ERROR_STOP=1
        -v drop_all_wei_tables_on_start="$${DROP_ALL_WEI_TABLES_ON_START:-false}"
        -f /init.sql
    networks:
      - shared_net

  wei-backtester:
    build: .
    command: python -m src.runner
    depends_on:
      init-wei-schema:
        condition: service_completed_successfully
    restart: "no"
    environment:
      # -- Datenbank-Verbindung -------------------------------------------------
      # Hostname der TimescaleDB im shared_net Docker-Netzwerk.
      PGHOST: "timescaledb"
      # Port der TimescaleDB.
      PGPORT: "5432"
      # Datenbankname (Quelltabellen und Ergebnistabellen liegen beide hier).
      PGDATABASE: "postgres"
      # DB-Benutzer mit SELECT auf alpaca_market_data_1day / world_regime_daily_scores_mv
      # und INSERT/UPDATE/DELETE auf backtest_wei_*.
      PGUSER: "market-data-account"
      # Passwort des DB-Benutzers.
      PGPASSWORD: "market-data-account-pw"

      # -- Strategie-Parameter ----------------------------------------------------
      # Gehandeltes Symbol (S&P-500-Proxy; muss in alpaca_market_data_1day vorhanden sein).
      SYMBOL: "VOO"
      # Erster Tag des Auswertungsfensters (Equity startet hier bei 1.0).
      START_DATE: "2022-01-03"
      # Letzter Tag des Fensters. Leer = heute.
      END_DATE: ""
      # Schneller EMA (Tage) des Trendfilters.
      EMA_FAST: "9"
      # Langsamer EMA (Tage) des Trendfilters.
      EMA_SLOW: "21"
      # Stress-Ampel AN, wenn der composite_score (Vortag) diese Schwelle erreicht.
      STRESS_ENTER: "57"
      # Stress-Ampel wieder AUS, wenn der Score auf diese Schwelle faellt (Hysterese,
      # muss unter STRESS_ENTER liegen).
      STRESS_EXIT: "52"
      # Transaktionskosten in Basispunkten pro Seite (Kauf bzw. Verkauf).
      COST_BPS_PER_SIDE: "5"
      # Zusaetzliche Kalendertage Preishistorie VOR START_DATE, damit die EMAs
      # am Starttag bereits warm sind.
      WARMUP_CALENDAR_DAYS: "365"
      # Freitext-Label des Runs; landet in backtest_wei_runs.run_label
      # (z. B. zum Unterscheiden von Parameter-Experimenten in Grafana).
      RUN_LABEL: "wei_regime_ema_9_21_57_52"
      # Log-Detailgrad: DEBUG, INFO, WARNING, ERROR.
      LOG_LEVEL: "INFO"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
