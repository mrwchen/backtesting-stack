services:
  init-wei-stocks-schema:
    image: postgres:17-alpine
    restart: "no"
    volumes:
      - ./init/schema.sql:/init.sql:ro
    environment:
      # Root-Passwort der TimescaleDB, nur fuer die Schema-Initialisierung.
      PGPASSWORD: "postgres-ts-root-pw"
      # Anwendungsname in pg_stat_activity (Diagnose, welche Verbindung von wem kommt).
      PGAPPNAME: "backtest_wei_stocks_init"
      # Praefix aller Ergebnistabellen (<prefix>runs, <prefix>trades, <prefix>equity_daily).
      # Muss ein gueltiger SQL-Identifier-Anfang sein (Kleinbuchstaben/Unterstriche)
      # und identisch zum TABLE_PREFIX des Runners.
      TABLE_PREFIX: "backtest_wei_stocks_"
      # true = ALLE Tabellen mit diesem Praefix droppen und neu anlegen.
      # Achtung: loescht saemtliche bisherigen Runs/Trades/Equity-Kurven unwiderruflich.
      DROP_ALL_WEI_STOCKS_TABLES_ON_START: "false"
    command:
      - sh
      - -c
      - >
        psql -h timescaledb -p 5432 -U postgres-ts -d postgres
        -v ON_ERROR_STOP=1
        -v drop_all_wei_stocks_tables_on_start="$${DROP_ALL_WEI_STOCKS_TABLES_ON_START:-false}"
        -v table_prefix="$${TABLE_PREFIX:-backtest_wei_stocks_}"
        -f /init.sql
    networks:
      - shared_net

  wei-stocks-backtester:
    build: .
    command: python -m src.runner
    depends_on:
      init-wei-stocks-schema:
        condition: service_completed_successfully
    restart: "no"
    environment:
      # -- Datenbank-Verbindung -------------------------------------------------
      # Hostname der TimescaleDB im shared_net Docker-Netzwerk.
      PGHOST: "timescaledb"
      # Port der TimescaleDB.
      PGPORT: "5432"
      # Datenbankname (Quelltabellen und Ergebnistabellen liegen beide hier).
      PGDATABASE: "postgres"
      # DB-Benutzer mit SELECT auf die Quelltabellen und Schreibrechten auf
      # backtest_wei_stocks_*.
      PGUSER: "market-data-account"
      # Passwort des DB-Benutzers.
      PGPASSWORD: "market-data-account-pw"

      # -- Datenquellen -----------------------------------------------------------
      # Tabelle mit Tages-Schlusskursen und Market Cap je Aktie; braucht die
      # Spalten symbol, period_end_date, adjusted_close, market_cap.
      METRICS_TABLE: "stock_core_market_metrics_daily"
      # Tabelle mit dem IBKR-Kategorie-Mapping; braucht die Spalten
      # source_symbol, ibkr_category, fetched_at.
      SYMBOLS_TABLE: "ibkr_symbols"
      # Tabelle/View mit dem Makro-Stress-Score; braucht die Spalten day, composite_score.
      SCORES_TABLE: "world_regime_daily_scores_mv"

      # -- Universum ---------------------------------------------------------------
      # Kommagetrennte IBKR-Kategorien; leer = alle Kategorien mit Mitgliedern.
      CATEGORIES: "Semiconductors,Software,Internet,Computers,Banks,Biotechnology,Pharmaceuticals,Retail,Oil&Gas,Aerospace/Defense,Insurance,Electric,Mining,Transportation"
      # Je Kategorie die N groessten Aktien (Market Cap gemaess UNIVERSE_MCAP_ASOF).
      # 0 = alle Aktien je Kategorie nach den sonstigen Filtern testen.
      TOP_N_PER_CATEGORY: "0"
      # Mindest-Market-Cap in USD fuer die Universumsauswahl.
      MIN_MARKET_CAP_USD: "2000000000"
      # Stichtag der Market Cap fuer die Universumsauswahl:
      #   start = Market Cap zum Fensterstart (point-in-time, ohne Blick in die
      #           Zukunft; Quelle ist die Tages-Market-Cap in METRICS_TABLE)
      #   end   = Market Cap zum Fensterende (ACHTUNG Survivorship-Bias: die
      #           Auswahl kennt die Gewinner von morgen; nur fuer Vergleiche
      #           mit alten Runs)
      # Die IBKR-Kategorie bleibt in beiden Modi der heutige Snapshot.
      UNIVERSE_MCAP_ASOF: "start"
      # Mindestanteil an Handelstagen mit Kursdaten im Fenster (0-100). Aktien
      # mit weniger Abdeckung (spaete IPOs, Delistings) fliegen aus dem Universum.
      MIN_COVERAGE_PCT: "90"

      # -- Signal-Engine (je Aktie) -------------------------------------------------
      # Erster Tag des Auswertungsfensters (Portfolio-Equity startet hier bei 1.0).
      START_DATE: "2022-01-03"
      # Letzter Tag des Fensters. Leer = heute.
      END_DATE: ""
      # Schneller EMA (Tage) des Trendfilters.
      EMA_FAST: "9"
      # Langsamer EMA (Tage) des Trendfilters.
      EMA_SLOW: "21"
      # Stress-Ampel AN, wenn der composite_score (Vortag) diese Schwelle erreicht.
      # Fuer Vergleichslaeufe per Shell ueberschreibbar, z. B.
      # STRESS_ENTER=55 STRESS_EXIT=50 RUN_LABEL=... docker compose up --build
      STRESS_ENTER: "${STRESS_ENTER:-57}"
      # Stress-Ampel wieder AUS, wenn der Score auf diese Schwelle faellt (Hysterese,
      # muss unter STRESS_ENTER liegen).
      STRESS_EXIT: "${STRESS_EXIT:-52}"
      # Entry erst N Handelstage nach dem flat->long-Flip, wenn das Signal die
      # ganze Zeit long geblieben ist (Bestaetigung). 0 = Entry am Flip-Tag.
      # Lokale Tests: 10 Tage eliminieren die Whipsaw-Kohorte nach Gate-Oeffnung
      # (Haltedauer 10-40 Tage, Winrate ~25%) und halbieren den Max-Drawdown-
      # Nachteil gegenueber der Benchmark.
      ENTRY_CONFIRM_DAYS: "10"
      # Katastrophen-Stop: Exit, wenn der Schlusskurs SL_PCT % unter dem Entry
      # liegt (0 = aus). Bewusst weit (20), damit er nur den linken Tail kappt
      # und Trendgewinner nicht anfasst; enge Stops (10) zerstoeren die Rendite.
      # Nach einem Stop ist das Symbol gesperrt, bis sein Signal auf flat geht.
      SL_PCT: "20"
      # Time-Stop: Exit, wenn der Trade nach TIME_STOP_DAYS Handelstagen noch
      # <= TIME_STOP_MIN_RET_PCT % steht (0 = aus). Recycelt totes Kapital;
      # feuert nie bei Gewinnern. 40 ist nur zusammen mit dem Re-Entry-Cooldown
      # sinnvoll: ohne ihn sperrt jeder Time-Stop das Symbol bis zum naechsten
      # Signal-Reset und die Rendite faellt deutlich (lokale Tests: -23%).
      TIME_STOP_DAYS: "40"
      # Schwelle des Time-Stops in % (<= 0; 0 = "unter Entry", -5 = erst ab -5%).
      TIME_STOP_MIN_RET_PCT: "0"
      # Re-Entry-Cooldown nach einem Time-Stop-Exit: das Symbol ist nach N
      # Handelstagen wieder Entry-Kandidat, solange sein Signal noch long ist
      # (0 = altes Verhalten, Sperre bis zum Signal-Reset). Der Katastrophen-
      # Stop sperrt unveraendert bis zum Reset. Lokale Tests 2026-07:
      # TS40+Cooldown5 kostet 11-16% Rendite vs. TS60 ohne Re-Entry, recycelt
      # totes Kapital aber ~4 Wochen frueher; jede staerkere Verkuerzung der
      # Haltedauer (TP, Trailing, harte Caps) zerstoerte die Rendite, weil
      # >100% des Gewinns in Trades mit >70 Tagen Haltedauer sitzen.
      REENTRY_COOLDOWN_DAYS: "5"
      # KEIN Take-Profit: jede getestete Gewinnmitnahme (25%/50%) hat die
      # Rendite drastisch reduziert - der Edge sitzt im rechten Tail.

      # -- Kategorie-Momentum-Sizing -------------------------------------------------
      # Lookback (Handelstage) des Kategorie-Momentums am Entry.
      CAT_MOM_WINDOW: "63"
      # Kategorie-Drawdown-Schwelle fuer die volle Positionsgroesse (z. B. -0.10 = -10%).
      CAT_MOM_DEEP_THRESHOLD: "-0.10"
      # Positionsgroesse in % der Portfolio-Equity, wenn Kategorie-Momentum <= deep.
      WEIGHT_DEEP_PCT: "6"
      # Positionsgroesse in %, wenn Kategorie-Momentum zwischen deep und 0 liegt
      # (auch Default, wenn am Entry noch kein Momentum berechenbar ist).
      WEIGHT_MILD_PCT: "3"
      # Positionsgroesse in %, wenn Kategorie-Momentum positiv ist (reduziert,
      # kein Verbot - siehe README/Out-of-sample-Befund).
      WEIGHT_POS_PCT: "1"

      # -- Portfolio-Regeln ------------------------------------------------------------
      # independent = jedes gueltige Aktiensignal als hypothetischer Einzeltrade,
      # ohne Cash-/Slot-/Kategorie-Limits. portfolio = echte Portfolio-Simulation
      # mit Cash, Positionslimits und Kategoriecaps.
      SIMULATION_MODE: "${SIMULATION_MODE:-portfolio}"
      # Maximale Anzahl gleichzeitiger Positionen.
      # Wird nur im portfolio-Modus verwendet. Lokale Tests 2026-07 (PIT-
      # Universum): bei 10 Slots prallen ~5.900-7.300 gueltige Flip-Kandidaten
      # an vollem Buch ab und die Rendite bleibt unter der Benchmark; 15/3 ist
      # der Kompromiss (2022: +60% statt +43%, 2020: +155% statt +95% bei
      # moderat mehr Drawdown), 25/2 hat das beste Return/DD-Verhaeltnis.
      MAX_POSITIONS: "15"
      # Maximale Anzahl gleichzeitiger Positionen je IBKR-Kategorie.
      # Wird nur im portfolio-Modus verwendet. Lokale Tests 2026-07 (Run-11-
      # Drawdown-Analyse): 5 erlaubt 3-4 Positionen derselben Kategorie vom
      # selben Entry-Tag (Biotech/Mining-Cluster = Hauptquelle der Drawdowns);
      # 3 verbessert Return/DD in beiden Testfenstern.
      MAX_PER_CATEGORY: "3"
      # Position auf TRIM_TARGET_PCT der Equity zurueckschneiden, sobald sie
      # ueber TRIM_ABOVE_PCT waechst (0 = kein Trimming). Ohne Trimming kann
      # eine einzelne 5%-Position die Equity und den Drawdown dominieren.
      # Wird nur im portfolio-Modus verwendet.
      TRIM_ABOVE_PCT: "10"
      # Zielgroesse in % der Equity nach einem Trim (muss < TRIM_ABOVE_PCT sein).
      TRIM_TARGET_PCT: "7.5"
      # Transaktionskosten in Basispunkten pro Seite (auf das gehandelte Volumen).
      COST_BPS_PER_SIDE: "5"
      # Zusaetzliche Kalendertage Preishistorie VOR START_DATE, damit EMAs und
      # Kategorie-Momentum am Starttag bereits warm sind.
      WARMUP_CALENDAR_DAYS: "365"

      # -- Sonstiges ----------------------------------------------------------------
      # Freitext-Label des Runs; landet in <TABLE_PREFIX>runs.run_label.
      RUN_LABEL: "${RUN_LABEL:-wei_stocks_regime_ema_9_21_57_52_confirm10_trim10_w631_sl20_ts40_re5}"
      # Praefix der Ergebnistabellen; muss zum TABLE_PREFIX des Init-Containers passen.
      TABLE_PREFIX: "backtest_wei_stocks_"
      # Log-Detailgrad: DEBUG, INFO, WARNING, ERROR.
      LOG_LEVEL: "INFO"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
